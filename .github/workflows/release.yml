name: Release Build and Publish

# Run only when a version tag starting with "v" is pushed.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Allow the workflow to create releases and upload assets.
permissions:
  contents: write

# Prevent overlapping release runs for the same tag.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: windows

    steps:
      # Check out the C++, Python, database, and dashboard sources.
      - name: Checkout repository
        uses: actions/checkout@v4

      # Install the Linux compiler and SQLite development headers.
      - name: Install Linux build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libsqlite3-dev

      # Run the required native Linux compilation command.
      - name: Compile Linux binary
        if: matrix.platform == 'linux'
        run: g++ -std=c++17 -O2 -Wall -Wextra -o giftyfy calculator.cpp -lsqlite3

      # Install Python and create an isolated environment for packaging.
      - name: Set up Linux Python environment
        if: matrix.platform == 'linux'
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Linux dashboard dependencies
        if: matrix.platform == 'linux'
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install streamlit pandas plotly PyQt6 PyQt6-WebEngine pyinstaller

      # Install the MinGW-w64 compiler used by the required Windows commands.
      - name: Set up MSYS2 and install MinGW toolchain
        if: matrix.platform == 'windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-toolchain

      # Install Windows Python and create an isolated packaging environment.
      - name: Set up Windows Python environment
        if: matrix.platform == 'windows'
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Windows dashboard dependencies
        if: matrix.platform == 'windows'
        shell: powershell
        run: |
          py -m venv .venv
          .venv\Scripts\python.exe -m pip install --upgrade pip
          .venv\Scripts\python.exe -m pip install streamlit pandas plotly PyQt6 PyQt6-WebEngine pyinstaller

      # Run the required MinGW SQLite compilation commands exactly as specified.
      - name: Compile Windows binary
        if: matrix.platform == 'windows'
        shell: msys2 {0}
        run: |
          x86_64-w64-mingw32-gcc -O2 -c sqlite3.c -o sqlite3.o
          x86_64-w64-mingw32-g++ -std=c++17 -O2 -Wall -Wextra -I. calculator.cpp sqlite3.o -o giftyfy.exe -static -static-libgcc -static-libstdc++

      # Generate the sample database used by the dashboard bundle.
      - name: Generate sample database
        shell: bash
        run: |
          if [ "${{ matrix.platform }}" = "linux" ]; then
            .venv/bin/python db-generate-sample.py giftyfy.db
          else
            .venv/Scripts/python.exe db-generate-sample.py giftyfy.db
          fi

      # Build the Linux CLI launcher and embed the compiled native binary.
      - name: Package Linux CLI launcher
        if: matrix.platform == 'linux'
        run: |
          .venv/bin/pyinstaller --onefile --name giftyfy --add-binary "giftyfy:." cli_launcher.py

      # Build the Windows CLI executable with a console window.
      - name: Package Windows CLI executable
        if: matrix.platform == 'windows'
        shell: powershell
        run: |
          .venv\Scripts\pyinstaller.exe --onefile --console --name giftyfy --add-binary "giftyfy.exe;." cli_launcher.py

      # Bundle the Streamlit source, database, and complete assets directory.
      - name: Package Linux dashboard executable
        if: matrix.platform == 'linux'
        run: |
          .venv/bin/pyinstaller --noconfirm dashboard.spec

      - name: Package Windows dashboard executable
        if: matrix.platform == 'windows'
        shell: powershell
        run: |
          .venv\Scripts\pyinstaller.exe --noconfirm dashboard.spec

      # Collect the Linux executables and seeded database under stable release asset names.
      - name: Prepare Linux artifacts
        if: matrix.platform == 'linux'
        run: |
          mkdir -p release-assets
          mkdir -p linux-release
          cp dist/giftyfy linux-release/giftyfy
          cp dist/dashboard linux-release/dashboard
          cp giftyfy.db linux-release/giftyfy.db
          chmod +x linux-release/giftyfy linux-release/dashboard
          tar -czf giftyfy-linux.tar.gz -C linux-release giftyfy dashboard giftyfy.db
          cp giftyfy-linux.tar.gz release-assets/
          test -f release-assets/giftyfy-linux.tar.gz

      # Collect the Windows executables and seeded database in one installable ZIP.
      - name: Prepare Windows artifacts
        if: matrix.platform == 'windows'
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force windows-release | Out-Null
          Copy-Item dist\giftyfy.exe windows-release\giftyfy.exe
          Copy-Item dist\dashboard.exe windows-release\dashboard.exe
          Copy-Item giftyfy.db windows-release\giftyfy.db
          Compress-Archive -Path windows-release\* -DestinationPath giftyfy-windows.zip -Force
          New-Item -ItemType Directory -Force release-assets | Out-Null
          Copy-Item giftyfy-windows.zip release-assets\giftyfy-windows.zip
          if (-not (Test-Path release-assets\giftyfy-windows.zip)) { throw 'Windows archive missing' }

      # Upload platform-specific artifacts for the separate publish job.
      - name: Upload Linux artifacts
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: linux-release-assets
          path: release-assets
          if-no-files-found: error

      - name: Upload Windows artifacts
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-assets
          path: release-assets
          if-no-files-found: error

  publish:
    name: Create Release and Publish Assets
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # Download both matrix artifacts into one directory.
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # Flatten the downloaded platform folders into the release directory.
      - name: Flatten release artifacts
        run: |
          mkdir -p dist
          find artifacts -type f -exec cp {} dist/ \;
          ls -la dist

      # Fail before release creation when any expected asset is missing.
      - name: Verify release artifacts
        run: |
          test -f dist/giftyfy-linux.tar.gz
          test -f dist/giftyfy-windows.zip

      # Create the release and ask GitHub to generate automated release notes.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/giftyfy-linux.tar.gz
            dist/giftyfy-windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
